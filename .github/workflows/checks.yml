name: Stock Studio checks
on:
  pull_request:
  push:
    branches: [codex/stock-studio-pages]
permissions:
  contents: read
jobs:
  postgres-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
